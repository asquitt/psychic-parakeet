# Model Training Workflow
#
# This workflow can be triggered manually to train a new model version
# Useful for scheduled retraining or manual model updates

name: Model Training

on:
  workflow_dispatch:
    inputs:
      data_path:
        description: 'Path to training data'
        required: true
        default: 'data/train.csv'
      model_type:
        description: 'Model type to train'
        required: true
        default: 'xgboost'
        type: choice
        options:
          - xgboost
          - random_forest
          - gradient_boosting
          - logistic_regression
      tune_hyperparameters:
        description: 'Tune hyperparameters'
        required: true
        type: boolean
        default: true
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  train-model:
    name: Train ML Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Start services
        run: |
          docker-compose up -d postgres mlflow
          sleep 30  # Wait for services to be ready

      - name: Run training pipeline
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
          POSTGRES_HOST: localhost
        run: |
          python -c "
          from ml_pipeline.orchestration.workflows import training_pipeline

          results = training_pipeline(
              data_path='${{ github.event.inputs.data_path || 'data/train.csv' }}',
              feature_columns=['feature1', 'feature2'],  # Update with actual features
              target_column='target',
              numerical_features=['feature1', 'feature2'],
              model_type='${{ github.event.inputs.model_type || 'xgboost' }}',
              tune_hyperparameters=${{ github.event.inputs.tune_hyperparameters || 'true' }}
          )

          print(f'Training complete! Model version: {results[\"model_version\"]}')
          "

      - name: Stop services
        if: always()
        run: docker-compose down
