# Prometheus Configuration
#
# This file configures Prometheus to scrape metrics from the ML pipeline services

global:
  scrape_interval: 15s  # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'ml-pipeline'

# Alerting configuration (optional - configure Alertmanager separately)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Model API metrics
  - job_name: 'model-api'
    static_configs:
      - targets: ['model-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s  # More frequent for API metrics

  # Scrape MLflow metrics (if exposed)
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: '/metrics'

  # Scrape Prefect metrics (if exposed)
  - job_name: 'prefect'
    static_configs:
      - targets: ['prefect-server:4200']
    metrics_path: '/api/metrics'
